<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}} - {{APP_NAME}}</title>
<style>
  :root {
    --bg: #fbf8f2; --fg: #2b2118; --muted: #6b5b4b; --accent: #8a5a14; --rule: #e4d9c8; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1713; --fg: #efe7da; --muted: #b3a593; --accent: #e0b062; --rule: #3a3128; --card: #241f19; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header, main, footer { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
  header { padding-top: 1.25rem; }
  .brand { margin: 0; font-weight: 700; letter-spacing: .02em; }
  nav { margin: .25rem 0 0; font-size: .9rem; }
  nav a { margin-right: 1rem; }
  a { color: var(--accent); }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 1.5rem 0 .25rem; }
  h2 { font-size: 1.2rem; margin: 2rem 0 .5rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
  h3 { font-size: 1.02rem; margin: 1.25rem 0 .25rem; }
  p, ul { margin: .5rem 0; }
  ul { padding-left: 1.25rem; }
  li { margin: .35rem 0; }
  .meta { color: var(--muted); font-size: .9rem; margin-top: 0; }
  .summary { background: var(--card); border: 1px solid var(--rule); border-radius: .75rem; padding: .25rem 1rem; }
  footer { margin-top: 3rem; padding-top: 1rem; padding-bottom: 2.5rem; border-top: 1px solid var(--rule);
           color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <p class="brand">{{APP_NAME}}</p>
  <nav>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
    <a href="/support">Support</a>
  </nav>
</header>
<main>
  <h1>{{TITLE}}</h1>
  {{CONTENT}}
</main>
<footer>
  <p>Published by {{PUBLISHER}}. Questions: <a href="mailto:{{SUPPORT_EMAIL}}">{{SUPPORT_EMAIL}}</a></p>
</footer>
</body>
</html>
