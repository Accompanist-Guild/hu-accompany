name: rust_lib_hu_accomponist
description: "Utility to build Rust code"
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffi: ^2.0.2
  ffigen: ^11.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    # macOS only. iOS links the engine itself, from the prebuilt libnative_ffi*.a files in frontend/ios (see
    # build_rs.sh); listing iOS here as well would link a second copy and fail with duplicate symbols.
    platforms:
      macos:
        ffiPlugin: true
