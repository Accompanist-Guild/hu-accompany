<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- The page does its own pinch zoom (re-laying the music out at the new size), so the
       browser's is off. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      touch-action: pan-x pan-y;          /* one finger scrolls; pinches come to us */
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    body.inking { touch-action: none; }   /* one finger draws; two fingers scroll and zoom */
    #page { position: relative; transform-origin: 0 0; }
    #score { padding: 8px 4px 24px; }
    #ink { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
    #ink path { fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* Live practice (OSMDBridge.live). A note due to be played sways a little,
       now and then, so the eye finds it without it shouting; a note just
       played gives a small hop. Both move the whole note (head and stem). */
    .hu-due { animation: hu-due 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 80%; }
    @keyframes hu-due {
      0%, 46%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-5deg); }
      22% { transform: rotate(4deg); }
      34% { transform: rotate(-2deg); }
    }
    .hu-jump { animation: hu-jump 360ms cubic-bezier(.3, .7, .35, 1); transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes hu-jump {
      0% { transform: translateY(0) scale(1); }
      38% { transform: translateY(-7px) scale(1.08); }
      72% { transform: translateY(1px) scale(.98); }
      100% { transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hu-due, .hu-jump { animation: none; }
    }
  </style>
  <!-- Bundled locally (OSMD 2.2.0, BSD-3-Clause, see LICENSE.txt) so the
       score renders without network access. -->
  <script src="opensheetmusicdisplay.min.js"></script>
  <script src="score_timeline.js"></script>
</head>
<body>
  <div id="page"><div id="score"></div><svg id="ink" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <script>
    // Bridge between Flutter (score_osmd_view.dart) and OSMD. Every message back to Flutter is
    // JSON: {type: 'bridgeReady' | 'loaded' | 'timeline' | 'error' | 'ink' | 'zoom', payload?: {...}}.
    //
    // Pen ink lives here, inside the scrolled page, so it moves with the music. Each stroke is
    // pinned to the bar it starts on (its measure and staff), so when the music is laid out again
    // (zoom, rotating the phone, a wider screen) the ink is redrawn on the same bar even if the
    // lines wrap differently. Across the bar a point is a share of the bar's width (bars stretch
    // to fill their line); up and down it's in staff units (which scale exactly with the zoom).
    (function () {
      function post(type, payload) {
        FlutterBridge.postMessage(JSON.stringify({ type: type, payload: payload }));
      }

      var osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('score', {
        autoResize: false,  // resizing is handled below so the zoom is refitted first
        backend: 'svg',
        drawTitle: true,
        drawPartNames: false,
      });
      var page = document.getElementById('page');
      var ink = document.getElementById('ink');
      var colored = [];
      var loaded = false;

      // ── Zoom ──────────────────────────────────────────────────────────
      // OSMD's zoom 1.0 is sized for a desktop page; on a phone that makes glyphs roughly twice
      // too big. The fitted zoom lays a line out as if on a page PAGE_WIDTH_PX wide; the
      // listener's pinch multiplies it (userScale), and it carries over when the phone turns.
      var PAGE_WIDTH_PX = 720;
      var MIN_SCALE = 0.5, MAX_SCALE = 3;
      var userScale = 1;
      function fitZoom() {
        var width = document.getElementById('score').clientWidth || window.innerWidth;
        osmd.zoom = Math.max(0.3, Math.min(1, width / PAGE_WIDTH_PX)) * userScale;
      }

      function render() {
        osmd.render();
        boxes = null;
        drawInk();
        applyLive();  // a new engraving: mark its notes again
      }

      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (!loaded) return;
          var keep = anchorAt(focusPoint(window.innerWidth / 2, 0));
          fitZoom();
          render();
          scrollToAnchor(keep, window.innerWidth / 2, 0);
        }, 150);
      });

      // ── Where bars are ────────────────────────────────────────────────
      function unitPx() { return 10 * osmd.zoom; }

      // The rendered music's top-left, in page pixels.
      function origin() {
        var svg = document.querySelector('#score svg');
        if (!svg) return { x: 0, y: 0 };
        var a = svg.getBoundingClientRect(), b = page.getBoundingClientRect();
        var scale = currentPreviewScale();
        return { x: (a.left - b.left) / scale, y: (a.top - b.top) / scale };
      }

      var boxes = null;  // every measure of every staff, in page pixels (until the next render)
      function measureBoxes() {
        if (boxes) return boxes;
        boxes = [];
        var list = (osmd.GraphicSheet && osmd.GraphicSheet.MeasureList) || [];
        var o = origin(), u = unitPx();
        list.forEach(function (staves, m) {
          (staves || []).forEach(function (measure, s) {
            if (!measure || !measure.PositionAndShape) return;
            var ps = measure.PositionAndShape, at = ps.AbsolutePosition;
            boxes.push({
              m: m, s: s,
              ax: o.x + at.x * u, ay: o.y + at.y * u,  // the anchor: OSMD's own position of the bar
              left: o.x + (at.x + ps.BorderLeft) * u, right: o.x + (at.x + ps.BorderRight) * u,
              top: o.y + (at.y + ps.BorderTop) * u, bottom: o.y + (at.y + ps.BorderBottom) * u,
            });
          });
        });
        return boxes;
      }

      function boxOf(m, s) {
        var all = measureBoxes();
        for (var i = 0; i < all.length; i++) if (all[i].m === m && all[i].s === s) return all[i];
        return null;
      }

      // The bar nearest a page point, and the point relative to it: x as a share of the bar's
      // width from its left edge, y in staff units from the bar's own position.
      function anchorAt(p) {
        var best = null, bestD = Infinity;
        measureBoxes().forEach(function (b) {
          var dx = Math.max(b.left - p.x, 0, p.x - b.right), dy = Math.max(b.top - p.y, 0, p.y - b.bottom);
          var d = dx * dx + dy * dy;
          if (d < bestD) { bestD = d; best = b; }
        });
        if (!best) return null;
        return { m: best.m, s: best.s, x: toShare(best, p.x), y: (p.y - best.ay) / unitPx() };
      }

      function pointOf(anchor) {
        var b = anchor && boxOf(anchor.m, anchor.s);
        if (!b) return null;
        return { x: fromShare(b, anchor.x), y: b.ay + anchor.y * unitPx() };
      }

      function toShare(b, x) { return (x - b.left) / Math.max(1, b.right - b.left); }
      function fromShare(b, share) { return b.left + share * (b.right - b.left); }

      // A screen point (from a touch) in page pixels.
      function focusPoint(clientX, clientY) {
        var b = page.getBoundingClientRect(), scale = currentPreviewScale();
        return { x: (clientX - b.left) / scale, y: (clientY - b.top) / scale };
      }

      // Scrolls so the anchor is back under the same spot on screen.
      function scrollToAnchor(anchor, clientX, clientY) {
        var p = pointOf(anchor);
        if (!p) return;
        var b = page.getBoundingClientRect();
        window.scrollBy(p.x - (clientX - b.left), p.y - (clientY - b.top));
      }

      // ── Ink ───────────────────────────────────────────────────────────
      // A stroke: {m, s, color, width (px at zoom 1), pts: [[x, y], ...] placed as anchorAt says}.
      var strokes = [];
      var undoStack = [];  // {add: stroke} | {erase: [[index, stroke], ...]} | {clear: [strokes]}
      var mode = 'off', penColor = '#C9A227', penWidth = 3, eraserRadius = 14;
      var NS = 'http://www.w3.org/2000/svg';

      function pathFor(stroke) {
        var b = boxOf(stroke.m, stroke.s);
        if (!b) return null;
        var u = unitPx(), d = '';
        stroke.pts.forEach(function (pt, i) {
          d += (i ? 'L' : 'M') + fromShare(b, pt[0]).toFixed(1) + ' ' + (b.ay + pt[1] * u).toFixed(1);
        });
        if (stroke.pts.length === 1) d += 'l0.01 0';  // a dot
        var path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('stroke', stroke.color);
        path.setAttribute('stroke-width', (stroke.width * osmd.zoom * 1.6).toFixed(2));
        return path;
      }

      function drawInk() {
        ink.setAttribute('width', page.scrollWidth);
        ink.setAttribute('height', page.scrollHeight);
        while (ink.firstChild) ink.removeChild(ink.firstChild);
        if (!loaded) return;
        strokes.forEach(function (stroke) {
          var path = pathFor(stroke);
          if (path) ink.appendChild(path);
        });
      }

      function inkChanged() {
        drawInk();
        post('ink', { canUndo: undoStack.length > 0, strokes: strokes });
      }

      var drawing = null;  // {stroke, path, anchorBox}
      function startStroke(p) {
        var a = anchorAt(p);
        if (!a) return;
        var stroke = { m: a.m, s: a.s, color: penColor, width: penWidth, pts: [[a.x, a.y]] };
        drawing = { stroke: stroke, path: pathFor(stroke) };
        if (drawing.path) ink.appendChild(drawing.path);
      }

      function extendStroke(p) {
        if (!drawing) return;
        var b = boxOf(drawing.stroke.m, drawing.stroke.s), u = unitPx();
        drawing.stroke.pts.push([toShare(b, p.x), (p.y - b.ay) / u]);
        drawing.path.setAttribute('d', drawing.path.getAttribute('d') + 'L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1));
      }

      function endStroke() {
        if (!drawing) return;
        strokes.push(drawing.stroke);
        undoStack.push({ add: drawing.stroke });
        drawing = null;
        inkChanged();
      }

      function dropStroke() {  // a second finger landed: that was the start of a scroll, not ink
        if (drawing && drawing.path) ink.removeChild(drawing.path);
        drawing = null;
      }

      var erased = null;  // what this eraser swipe has taken, as one undo step
      function eraseAt(p) {
        var reach = eraserRadius;
        for (var i = strokes.length - 1; i >= 0; i--) {
          var stroke = strokes[i], b = boxOf(stroke.m, stroke.s);
          if (!b) continue;
          var u = unitPx(), hitR = reach + stroke.width * osmd.zoom;
          var hit = stroke.pts.some(function (pt) {
            var dx = fromShare(b, pt[0]) - p.x, dy = b.ay + pt[1] * u - p.y;
            return dx * dx + dy * dy <= hitR * hitR;
          });
          if (hit) {
            erased = erased || [];
            erased.push([i, stroke]);
            strokes.splice(i, 1);
            drawInk();
          }
        }
      }

      function endErase() {
        if (erased && erased.length) undoStack.push({ erase: erased });
        if (erased) inkChanged();
        erased = null;
      }

      // ── Touch: draw, scroll, zoom ─────────────────────────────────────
      var pinch = null;  // {dist, mid, scrollX, scrollY, anchor}
      var previewScale = 1;
      function currentPreviewScale() { return previewScale; }

      function mid(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
      function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) || 1; }

      document.addEventListener('touchstart', function (e) {
        if (!loaded) return;
        if (e.touches.length >= 2) {
          e.preventDefault();
          dropStroke();
          endErase();
          var m = mid(e.touches);
          pinch = { dist: dist(e.touches), mid: m, last: m, anchor: anchorAt(focusPoint(m.x, m.y)) };
          var f = focusPoint(m.x, m.y);
          page.style.transformOrigin = f.x + 'px ' + f.y + 'px';
          return;
        }
        if (mode === 'off' || pinch) return;
        e.preventDefault();
        var p = focusPoint(e.touches[0].clientX, e.touches[0].clientY);
        if (mode === 'pen') startStroke(p); else { erased = []; eraseAt(p); }
      }, { passive: false });

      document.addEventListener('touchmove', function (e) {
        if (!loaded) return;
        if (pinch && e.touches.length >= 2) {
          e.preventDefault();
          var m = mid(e.touches);
          window.scrollBy(pinch.last.x - m.x, pinch.last.y - m.y);  // two fingers pan, in any mode
          pinch.last = m;
          previewScale = Math.max(MIN_SCALE / userScale, Math.min(MAX_SCALE / userScale, dist(e.touches) / pinch.dist));
          page.style.transform = 'scale(' + previewScale + ')';
          return;
        }
        if (mode === 'off' || pinch) return;
        e.preventDefault();
        var p = focusPoint(e.touches[0].clientX, e.touches[0].clientY);
        if (mode === 'pen') extendStroke(p); else eraseAt(p);
      }, { passive: false });

      function touchEnd(e) {
        if (pinch) {
          if (e.touches.length < 2) finishPinch();
          return;
        }
        if (e.touches.length > 0) return;
        if (mode === 'pen') endStroke(); else if (mode === 'eraser') endErase();
      }
      document.addEventListener('touchend', touchEnd);
      document.addEventListener('touchcancel', touchEnd);

      function finishPinch() {
        var p = pinch;
        pinch = null;
        var scale = previewScale;
        previewScale = 1;
        page.style.transform = '';
        if (Math.abs(scale - 1) < 0.03) return;
        userScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, userScale * scale));
        fitZoom();
        render();  // laid out again at the new size: crisp, and the lines wrap to the screen
        scrollToAnchor(p.anchor, p.last.x, p.last.y);
        post('zoom', { scale: userScale });
      }

      // ── Notes ─────────────────────────────────────────────────────────
      // Notes of one measure, flattened across staves, in the order
      // NoteRef(measure, voiceEntry, noteIndex) addresses them.
      function voiceEntriesOf(measureIndex) {
        var staves = osmd.GraphicSheet.MeasureList[measureIndex] || [];
        var entries = [];
        staves.forEach(function (measure) {
          if (!measure) return;
          measure.staffEntries.forEach(function (staffEntry) {
            staffEntry.graphicalVoiceEntries.forEach(function (ve) { entries.push(ve); });
          });
        });
        return entries;
      }

      // ── Live practice ─────────────────────────────────────────────────
      // The app (score_practice_session.dart) says, by timeline note id, which
      // notes were played right or wrong, which are due, and which were just
      // played. Marks are kept here and applied to whatever is drawn, so they
      // survive zooming and turning the phone (both draw the score again).
      var timeline = null;        // ScoreTimeline.extract() of the loaded score
      var marks = {};             // id -> 'right' | 'wrong'
      var dueIds = [];
      var following = false;
      var lastTouch = 0;
      var COLORS = { right: '#7CC59A', wrong: '#D9534F' };

      function graphicOf(id) {
        var source = timeline && timeline.sources[id];
        if (!source) return null;
        try { return osmd.EngravingRules.GNote(source) || null; } catch (e) { return null; }
      }

      // The note's own head. A chord draws all its heads in one VexFlow note,
      // lowest first, so a chord member is picked by its rank in pitch.
      function headsOf(g) {
        var heads = g.getNoteheadSVGs ? g.getNoteheadSVGs() : [];
        if (heads.length <= 1) return heads;
        var pitches = ((g.parentVoiceEntry && g.parentVoiceEntry.notes) || [])
          .map(function (n) { return n.sourceNote && n.sourceNote.halfTone; })
          .filter(function (p) { return typeof p === 'number'; })
          .sort(function (a, b) { return a - b; });
        var rank = pitches.indexOf(g.sourceNote.halfTone);
        return rank >= 0 && heads[rank] ? [heads[rank]] : heads;
      }

      function tint(el, color) {
        var parts = [el].concat(Array.prototype.slice.call(el.querySelectorAll('*')));
        parts.forEach(function (part) {
          ['fill', 'stroke'].forEach(function (attr) {
            var kept = 'data-hu-' + attr;
            if (!part.hasAttribute(kept)) part.setAttribute(kept, part.getAttribute(attr) || '');
            var original = part.getAttribute(kept);
            if (color && (attr === 'fill' || (original && original !== 'none'))) part.setAttribute(attr, color);
            else if (original) part.setAttribute(attr, original);
            else part.removeAttribute(attr);
          });
        });
      }

      function paint(id, mark) {
        var g = graphicOf(id);
        if (!g) return;
        headsOf(g).forEach(function (head) { tint(head, mark ? COLORS[mark] : null); });
      }

      function groupOf(id) {
        var g = graphicOf(id);
        return g && g.getSVGGElement ? g.getSVGGElement() : null;
      }

      function setDue(ids) {
        dueIds.forEach(function (id) { var el = groupOf(id); if (el) el.classList.remove('hu-due'); });
        dueIds = ids || [];
        dueIds.forEach(function (id) {
          // A repeat: the same written note again, so its first time's colour goes.
          if (!marks[id]) paint(id, null);
          var el = groupOf(id);
          if (el && !el.classList.contains('hu-jump')) el.classList.add('hu-due');
        });
      }

      function jump(id) {
        var el = groupOf(id);
        if (!el) return;
        el.classList.remove('hu-due', 'hu-jump');
        void el.getBoundingClientRect();  // restart the animation
        el.classList.add('hu-jump');
        el.addEventListener('animationend', function done() {
          el.classList.remove('hu-jump');
          el.removeEventListener('animationend', done);
        });
      }

      // Keeps the next note to play in view, unless the player has just
      // scrolled the page themselves.
      function keepInView() {
        if (!following || !dueIds.length || Date.now() - lastTouch < 4000) return;
        var el = groupOf(dueIds[0]);
        if (!el) return;
        var r = el.getBoundingClientRect(), h = window.innerHeight;
        if (r.top < h * 0.12 || r.bottom > h * 0.72) {
          window.scrollTo({ top: window.scrollY + r.top - h * 0.3, behavior: 'smooth' });
        }
      }

      function applyLive() {
        if (!timeline) return;
        Object.keys(marks).sort(function (a, b) { return a - b; }).forEach(function (id) { paint(+id, marks[id]); });
        setDue(dueIds);
      }

      function postTimeline() {
        try {
          timeline = ScoreTimeline.extract(osmd);
          post('timeline', {
            notes: timeline.notes, bpm: timeline.bpm, timeSignature: timeline.timeSignature,
            instrument: timeline.instrument, staves: timeline.staves,
          });
        } catch (e) {
          timeline = null;
          post('timeline', { notes: [], error: String(e && e.message || e) });
        }
      }

      document.addEventListener('touchstart', function () { lastTouch = Date.now(); }, { passive: true });

      window.OSMDBridge = {
        // update: {right: [ids], wrong: [ids], due: [ids] (omit to keep),
        //          played: [ids], follow: bool}
        live: function (update) {
          if (!timeline) return;
          (update.right || []).forEach(function (id) { marks[id] = 'right'; paint(id, 'right'); });
          (update.wrong || []).forEach(function (id) { marks[id] = 'wrong'; paint(id, 'wrong'); });
          if (typeof update.follow === 'boolean') following = update.follow;
          if (update.due) setDue(update.due);
          (update.played || []).forEach(jump);
          keepInView();
        },

        // A new run: every note back to black, nothing due.
        resetLive: function () {
          var ids = Object.keys(marks);
          marks = {};
          ids.forEach(function (id) { paint(+id, null); });
          setDue([]);
        },

        loadScore: function (xml) {
          colored = [];
          loaded = false;
          strokes = [];
          undoStack = [];
          timeline = null;
          marks = {};
          dueIds = [];
          drawInk();
          osmd.load(xml)
            .then(function () {
              loaded = true;
              fitZoom();
              render();
              post('loaded');
              postTimeline();
            })
            .catch(function (e) { post('error', { message: String(e && e.message || e) }); });
        },

        colorNotes: function (refs, hex) {
          refs.forEach(function (ref) {
            var ve = voiceEntriesOf(ref.measure)[ref.voiceEntry];
            var note = ve && ve.notes[ref.noteIndex];
            if (!note) return;
            note.sourceNote.NoteheadColor = hex;
            colored.push(note.sourceNote);
          });
          render();
        },

        resetColors: function () {
          colored.forEach(function (sourceNote) { sourceNote.NoteheadColor = undefined; });
          colored = [];
          render();
        },

        // mode: 'off' | 'pen' | 'eraser'. Width is the pen's size in the app.
        setInkMode: function (newMode, color, width) {
          mode = newMode;
          if (color) penColor = color;
          if (width) penWidth = width;
          document.body.classList.toggle('inking', mode !== 'off');
        },

        // Strokes saved for this score (as sent in an 'ink' message), after loadScore.
        setInk: function (saved) {
          strokes = Array.isArray(saved) ? saved : [];
          undoStack = [];
          drawInk();
        },

        undoInk: function () {
          var step = undoStack.pop();
          if (!step) return;
          if (step.add) strokes.splice(strokes.indexOf(step.add), 1);
          if (step.erase) step.erase.slice().reverse().forEach(function (e) { strokes.splice(e[0], 0, e[1]); });
          if (step.clear) strokes = step.clear;
          inkChanged();
        },

        clearInk: function () {
          if (!strokes.length) return;
          undoStack.push({ clear: strokes });
          strokes = [];
          inkChanged();
        },

        setZoom: function (scale) {
          userScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale || 1));
          if (loaded) { fitZoom(); render(); }
        },
      };

      post('bridgeReady');
    })();
  </script>
</body>
</html>
