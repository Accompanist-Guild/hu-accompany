[package]
name = "web_engine"
version = "0.1.0"
edition = "2024"
description = "The app's note detector (native_ffi) for the website: audio pushed in from the browser, notes out."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
native_ffi = { path = "../native_ffi" }
wasm-bindgen = "=0.2.129"
serde_json = "1.0"
# The engine's dependencies draw randomness through these; in a browser it comes from crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
